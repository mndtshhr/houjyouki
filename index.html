<main id="m"><h1 class="t">方丈記</h1><p class="by">鴨長明　現代語訳 佐藤春夫</p></main>
<script>
const D={"S": ["行く川のながれは絶えずして、しかも本の水にあらず。", "よどみに浮ぶうたかたは、かつ消えかつ結びて久しくとゞまることなし。", "世の中にある人とすみかと、またかくの如し。", "玉しきの都の中にむねをならべいらかをあらそへる、たかきいやしき人のすまひは、代々を經て盡きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり。", "或はこぞ破れ（やけイ）てことしは造り、あるは大家ほろびて小家となる。", "住む人もこれにおなじ。", "所もかはらず、人も多かれど、いにしへ見し人は、二三十人が中に、わづかにひとりふたりなり。", "あしたに死し、ゆふべに生るゝならひ、たゞ水の泡にぞ似たりける。", "知らず、生れ死ぬる人、いづかたより來りて、いづかたへか去る。", "又知らず、かりのやどり、誰が爲に心を惱まし、何によりてか目をよろこばしむる。", "そのあるじとすみかと、無常をあらそひ去るさま、いはゞ朝顏の露にことならず。", "或は露おちて花のこれり。", "のこるといへども朝日に枯れぬ。", "或は花はしぼみて、露なほ消えず。", "消えずといへども、ゆふべを待つことなし。", "およそ物の心を知れりしよりこのかた、四十あまりの春秋をおくれる間に、世のふしぎを見ることやゝたびたびになりぬ。", "いにし安元三年四月廿八日かとよ、風烈しく吹きてしづかならざりし夜、戌の時ばかり、都のたつみより火出で來りていぬゐに至る。", "はてには朱雀門、大極殿、大學寮、民部の省まで移りて、ひとよがほどに、塵灰となりにき。", "火本は樋口富の小路とかや、病人を宿せるかりやより出で來けるとなむ。", "吹きまよふ風にとかく移り行くほどに、扇をひろげたるが如くすゑひろになりぬ。", "遠き家は煙にむせび、近きあたりはひたすらほのほを地に吹きつけたり。", "空には灰を吹きたてたれば、火の光に映じてあまねくくれなゐなる中に、風に堪へず吹き切られたるほのほ、飛ぶが如くにして一二町を越えつゝ移り行く。", "その中の人うつゝ（しイ）心ならむや。", "あるひは煙にむせびてたふれ伏し、或は炎にまぐれてたちまちに死しぬ。", "或は又わづかに身一つからくして遁れたれども、資財を取り出づるに及ばず。", "七珍萬寳、さながら灰燼となりにき。", "そのつひえいくそばくぞ。", "このたび公卿の家十六燒けたり。", "ましてその外は數を知らず。", "すべて都のうち、三分が二（一イ）に及べりとぞ。", "男女死ぬるもの數千人、馬牛のたぐひ邊際を知らず。", "人のいとなみみなおろかなる中に、さしも危き京中の家を作るとて寶をつひやし心をなやますことは、すぐれてあぢきなくぞ侍るべき。", "また治承四年卯月廿九日のころ、中の御門京極のほどより、大なるつじかぜ起りて、六條わたりまで、いかめしく吹きけること侍りき。", "三四町をかけて吹きまくるに、その中にこもれる家ども、大なるもちひさきも、一つとしてやぶれざるはなし。", "さながらひらにたふれたるもあり。", "けたはしらばかり殘れるもあり。", "又門の上を吹き放ちて、四五町がほど（ほかイ）に置き、又垣を吹き拂ひて、隣と一つになせり。", "いはむや家の内のたから、數をつくして空にあがり、ひはだぶき板のたぐひ、冬の木の葉の風に亂るゝがごとし。", "塵を煙のごとく吹き立てたれば、すべて目も見えず。", "おびたゞしくなりとよむ音に、物いふ聲も聞えず。", "かの地獄の業風なりとも、かばかりにとぞ覺ゆる。", "家の損亡するのみならず、これをとり繕ふ間に、身をそこなひて、かたはづけるもの數を知らず。", "この風ひつじさるのかたに移り行きて、多くの人のなげきをなせり。", "つじかぜはつねに吹くものなれど、かゝることやはある。", "たゞごとにあらず。", "さるべき物のさとしかなとぞ疑ひ侍りし。", "又おなじ年の六月の頃、にはかに都うつり侍りき。", "いと思ひの外なりし事なり。", "大かたこの京のはじめを聞けば、嵯峨の天皇の御時、都とさだまりにけるより後、既に數百歳を經たり。", "異なるゆゑなくて、たやすく改まるべくもあらねば、これを世の人、たやすからずうれへあへるさま、ことわりにも過ぎたり。", "されどとかくいふかひなくて、みかどよりはじめ奉りて、大臣公卿ことごとく攝津國難波の京に（八字イ無）うつり給ひぬ。", "世に仕ふるほどの人、誰かひとりふるさとに殘り居らむ。", "官位に思ひをかけ、主君のかげを頼むほどの人は、一日なりとも、とくうつらむとはげみあへり。", "時を失ひ世にあまされて、ごする所なきものは、愁へながらとまり居れり。", "軒を爭ひし人のすまひ、日を經つゝあれ行く。", "家はこぼたれて淀川に浮び、地は目の前に畠となる。", "人の心皆あらたまりて、たゞ馬鞍をのみ重くす。", "牛車を用とする人なし。", "西南海の所領をのみ願ひ、東北國の庄園をば好まず。", "その時、おのづから事のたよりありて、津の國今の京に到れり。", "所のありさまを見るに、その地ほどせまくて、條里をわるにたらず。", "北は山にそひて高く、南は海に近くてくだれり。", "なみの音つねにかまびすしくて、潮風殊にはげしく、内裏は山の中なれば、かの木の丸殿もかくやと、なかなかやうかはりて、いうなるかたも侍りき。", "日々にこぼちて川もせきあへずはこびくだす家はいづくにつくれるにかあらむ。", "なほむなしき地は多く、作れる屋はすくなし。", "ふるさとは既にあれて、新都はいまだならず。", "ありとしある人、みな浮雲のおもひをなせり。", "元より此處に居れるものは、地を失ひてうれへ、今うつり住む人は、土木のわづらひあることをなげく。", "道のほとりを見れば、車に乘るべきはうまに乘り、衣冠布衣なるべきはひたゝれを着たり。", "都のてふりたちまちにあらたまりて、唯ひなびたる武士にことならず。", "これは世の亂るゝ瑞相とか聞きおけるもしるく、日を經つゝ世の中うき立ちて、人の心も治らず、民のうれへつひにむなしからざりければ、おなじ年の冬、猶この京に歸り給ひにき。", "されどこぼちわたせりし家どもはいかになりにけるにか、ことごとく元のやうにも作らず。", "ほのかに傳へ聞くに、いにしへのかしこき御代には、あはれみをもて國ををさめ給ふ。", "則ち御殿に茅をふきて軒をだにとゝのへず。", "煙のともしきを見給ふ時は、かぎりあるみつぎものをさへゆるされき。", "これ民をめぐみ、世をたすけ給ふによりてなり。", "今の世の中のありさま、昔になぞらへて知りぬべし。", "又養和のころかとよ、久しくなりてたしかにも覺えず、二年が間、世の中飢渇して、あさましきこと侍りき。", "或は春夏日でり、或は秋冬大風、大水などよからぬ事どもうちつゞきて、五穀ことごとくみのらず。", "むなしく春耕し、夏植うるいとなみありて、秋かり冬收むるぞめきはなし。", "これによりて、國々の民、或は地を捨てゝ堺を出で、或は家をわすれて山にすむ。", "さまざまの御祈はじまりて、なべてならぬ法ども行はるれども、さらにそのしるしなし。", "京のならひなに事につけても、みなもとは田舍をこそたのめるに、絶えてのぼるものなければ、さのみやはみさをも作りあへむ。", "念じわびつゝ、さまざまの寳もの、かたはしより捨つるがごとくすれども、さらに目みたつる人もなし。", "たまたま易ふるものは、金をかろくし、粟を重くす。", "乞食道の邊におほく、うれへ悲しむ聲耳にみてり。", "さきの年かくの如くからくして暮れぬ。", "明くる年は立ちなほるべきかと思ふに、あまさへえやみうちそひて、まさるやうにあとかたなし。", "世の人みな飢ゑ死にければ、日を經つゝきはまり行くさま、少水の魚のたとへに叶へり。", "はてには笠うちき、足ひきつゝみ、よろしき姿したるもの、ひたすら家ごとに乞ひありく。", "かくわびしれたるものどもありくかと見れば則ち斃れふしぬ。", "ついひぢのつら、路頭に飢ゑ死ぬるたぐひは數もしらず。", "取り捨つるわざもなければ、くさき香世界にみちみちて、かはり行くかたちありさま、目もあてられぬこと多かり。", "いはむや河原などには、馬車の行きちがふ道だにもなし。", "しづ、山がつも、力つきて、薪にさへともしくなりゆけば、たのむかたなき人は、みづから家をこぼちて市に出でゝこれを賣るに、一人がもち出でたるあたひ、猶一日が命をさゝふるにだに及ばずとぞ。", "あやしき事は、かゝる薪の中に、につき、しろがねこがねのはくなど所々につきて見ゆる木のわれあひまじれり。", "これを尋ぬればすべき方なきものゝ、古寺に至りて佛をぬすみ、堂の物の具をやぶりとりて、わりくだけるなりけり。", "濁惡の世にしも生れあひて、かゝる心うきわざをなむ見侍りし。", "又あはれなること侍りき。", "さりがたき女男など持ちたるものは、その思ひまさりて、心ざし深きはかならずさきだちて死しぬ。", "そのゆゑは、我が身をば次になして、男にもあれ女にもあれ、いたはしく思ふかたに、たまたま乞ひ得たる物を、まづゆづるによりてなり。", "されば父子あるものはさだまれる事にて、親ぞさきだちて死にける。", "又（父イ）母が命つきて臥せるをもしらずして、いとけなき子のその乳房に吸ひつきつゝ、ふせるなどもありけり。", "仁和寺に、慈尊院の大藏卿隆曉法印といふ人、かくしつゝ、かずしらず死ぬることをかなしみて、ひじりをあまたかたらひつゝ、その死首の見ゆるごとに、額に阿字を書きて、縁をむすばしむるわざをなむせられける。", "その人數を知らむとて、四五兩月がほどかぞへたりければ、京の中、一條より南、九條より北、京極より西、朱雀より東、道のほとりにある頭、すべて四萬二千三百あまりなむありける。", "いはむやその前後に死ぬるもの多く、河原、白河、にしの京、もろもろの邊地などをくはへていはゞ際限もあるべからず。", "いかにいはむや、諸國七道をや。", "近くは崇徳院の御位のとき、長承のころかとよ、かゝるためしはありけると聞けど、その世のありさまは知らず。", "まのあたりいとめづらかに、かなしかりしことなり。", "また元暦二年のころ、おほなゐふること侍りき。", "そのさまよのつねならず。", "山くづれて川を埋み、海かたぶきて陸をひたせり。", "土さけて水わきあがり、いはほわれて谷にまろび入り、なぎさこぐふねは浪にたゞよひ、道ゆく駒は足のたちどをまどはせり。", "いはむや都のほとりには、在々所々堂舍廟塔、一つとして全からず。", "或はくづれ、或はたふれた（ぬイ）る間、塵灰立ちあがりて盛なる煙のごとし。", "地のふるひ家のやぶるゝ音、いかづちにことならず。", "家の中に居れば忽にうちひしげなむとす。", "はしり出づればまた地われさく。", "羽なければ空へもあがるべからず。", "龍ならねば雲にのぼらむこと難し。", "おそれの中におそるべかりけるは、たゞ地震なりけるとぞ覺え侍りし。", "その中に、あるものゝふのひとり子の、六つ七つばかりに侍りしが、ついぢのおほひの下に小家をつくり、はかなげなるあとなしごとをして遊び侍りしが、俄にくづれうめられて、あとかたなくひらにうちひさがれて、二つの目など一寸ばかりうち出されたるを、父母かゝへて、聲もをしまずかなしみあひて侍りしこそあはれにかなしく見はべりしか。", "子のかなしみにはたけきものも耻を忘れけりと覺えて、いとほしくことわりかなとぞ見はべりし。", "かくおびたゞしくふることはしばしにて止みにしかども、そのなごりしばしば絶えず。", "よのつねにおどろくほどの地震、二三十度ふらぬ日はなし。", "十日廿日過ぎにしかば、やうやうまどほになりて、或は四五度、二三度、もしは一日まぜ、二三日に一度など、大かたそのなごり、三月ばかりや侍りけむ。", "四大種の中に、水火風はつねに害をなせど、大地に至りては殊なる變をなさず。", "むかし齊衡のころかとよ。", "おほなゐふりて、東大寺の佛のみぐし落ちなどして、いみじきことゞも侍りけれど、猶このたびにはしかずとぞ。", "すなはち人皆あぢきなきことを述べて、いさゝか心のにごりもうすらぐと見えしほどに、月日かさなり年越えしかば、後は言の葉にかけて、いひ出づる人だになし。", "すべて世のありにくきこと、わが身とすみかとの、はかなくあだなるさまかくのごとし。", "いはむや所により、身のほどにしたがひて、心をなやますこと、あげてかぞふべからず。", "もしおのづから身かずならずして、權門のかたはらに居るものは深く悦ぶことあれども、大にたのしぶにあたはず。", "なげきある時も聲をあげて泣くことなし。", "進退やすからず、たちゐにつけて恐れをのゝくさま、たとへば、雀の鷹の巣に近づけるがごとし。", "もし貧しくして富める家の隣にをるものは、朝夕すぼき姿を耻ぢてへつらひつゝ出で入る妻子、僮僕のうらやめるさまを見るにも、富める家のひとのないがしろなるけしきを聞くにも、心念々にうごきて時としてやすからず。", "もしせばき地に居れば、近く炎上する時、その害をのがるゝことなし。", "もし邊地にあれば、往反わづらひ多く、盜賊の難はなれがたし。", "いきほひあるものは貪欲ふかく、ひとり身なるものは人にかろしめらる。", "寶あればおそれ多く、貧しければなげき切なり。", "人を頼めば身他のやつことなり、人をはごくめば心恩愛につかはる。", "世にしたがへば身くるし。", "またしたがはねば狂へるに似たり。", "いづれの所をしめ、いかなるわざをしてか、しばしもこの身をやどし玉ゆらも心をなぐさむべき。", "我が身、父の方の祖母の家をつたへて、久しく彼所に住む。", "そののち縁かけ、身おとろへて、しのぶかたがたしげかりしかば、つひにあととむることを得ずして、三十餘にして、更に我が心と一の庵をむすぶ。", "これをありしすまひになずらふるに、十分が一なり。", "たゞ居屋ばかりをかまへて、はかばかしくは屋を造るにおよばず。", "わづかについひぢをつけりといへども、門たつるたづきなし。", "竹を柱として、車やどりとせり。", "雪ふり風吹くごとに、危ふからずしもあらず。", "所は河原近ければ、水の難も深く、白波のおそれもさわがし。", "すべてあらぬ世を念じ過ぐしつゝ、心をなやませることは、三十餘年なり。", "その間をりをりのたがひめに、おのづから短き運をさとりぬ。", "すなはち五十の春をむかへて、家をいで世をそむけり。", "もとより妻子なければ、捨てがたきよすがもなし。", "身に官祿あらず、何につけてか執をとゞめむ。", "むなしく大原山の雲にふして、またいくそばくの春秋をかへぬる。", "こゝに六十の露消えがたに及びて、さらに末葉のやどりを結べることあり。", "いはゞ狩人のひとよの宿をつくり、老いたるかひこのまゆをいとなむがごとし。", "これを中ごろのすみかになずらふれば、また百分が一にだもおよばず。", "とかくいふ程に、よはひは年々にかたぶき、すみかはをりをりにせばし。", "その家のありさまよのつねにも似ず、廣さはわづかに方丈、高さは七尺が内なり。", "所をおもひ定めざるがゆゑに、地をしめて造らず。", "土居をくみ、うちおほひをふきて、つぎめごとにかけがねをかけたり。", "もし心にかなはぬことあらば、やすく外へうつさむがためなり。", "そのあらため造るとき、いくばくのわづらひかある。", "積むところわづかに二輌なり。", "車の力をむくゆるほかは、更に他の用途いらず。", "いま日野山の奧にあとをかくして後、南にかりの日がくしをさし出して、竹のすのこを敷き、その西に閼伽棚を作り、うちには西の垣に添へて、阿彌陀の畫像を安置したてまつりて、落日をうけて、眉間のひかりとす。", "かの帳のとびらに、普賢ならびに不動の像をかけたり。", "北の障子の上に、ちひさき棚をかまへて、黒き皮籠三四合を置く。", "すなはち和歌、管絃、往生要集ごときの抄物を入れたり。", "傍にこと、琵琶、おのおの一張をたつ。", "いはゆるをりごと、つき琵琶これなり。", "東にそへて、わらびのほどろを敷き、つかなみを敷きて夜の床とす。", "東の垣に窓をあけて、こゝにふづくゑを出せり。", "枕の方にすびつあり。", "これを柴折りくぶるよすがとす。", "庵の北に少地をしめ、あばらなるひめ垣をかこひて園とす。", "すなはちもろもろの藥草をうゑたり。", "かりの庵のありさまかくのごとし。", "その所のさまをいはゞ、南にかけひあり、岩をたゝみて水をためたり。", "林軒近ければ、つま木を拾ふにともしからず。", "名を外山といふ。", "まさきのかづらあとをうづめり。", "谷しげゝれど、にしは晴れたり。", "觀念のたよりなきにしもあらず。", "春は藤なみを見る、紫雲のごとくして西のかたに匂ふ。", "夏は郭公をきく、かたらふごとに死出の山路をちぎる。", "秋は日ぐらしの聲耳に充てり。", "うつせみの世をかなしむかと聞ゆ。", "冬は雪をあはれむ。", "つもりきゆるさま、罪障にたとへつべし。", "もしねんぶつものうく、どきやうまめならざる時は、みづから休み、みづからをこたるにさまたぐる人もなく、また耻づべき友もなし。", "殊更に無言をせざれども、ひとり居ればくごふををさめつべし。", "必ず禁戒をまもるとしもなけれども、境界なければ何につけてか破らむ。", "もしあとの白波に身をよするあしたには、岡のやに行きかふ船をながめて、滿沙彌が風情をぬすみ、もし桂の風、葉をならすゆふべには、潯陽の江をおもひやりて、源都督（經信）のながれをならふ。", "もしあまりの興あれば、しばしば松のひゞきに秋風の樂をたぐへ、水の音に流泉の曲をあやつる。", "藝はこれつたなけれども、人の耳を悦ばしめむとにもあらず。", "ひとりしらべ、ひとり詠じて、みづから心を養ふばかりなり。", "また麓に、一つの柴の庵あり。", "すなはちこの山もりが居る所なり。", "かしこに小童あり、時々來りてあひとぶらふ。", "もしつれづれなる時は、これを友としてあそびありく。", "かれは十六歳、われは六十、その齡ことの外なれど、心を慰むることはこれおなじ。", "あるはつばなをぬき、いはなしをとる（りイ）。", "またぬかごをもり、芹をつむ。", "或はすそわの田井に至りて、おちほを拾ひてほぐみをつくる。", "もし日うらゝかなれば、嶺によぢのぼりて、はるかにふるさとの空を望み。", "木幡山、伏見の里、鳥羽、羽束師を見る。", "勝地はぬしなければ、心を慰むるにさはりなし。", "あゆみわづらひなく、志遠くいたる時は、これより峯つゞき炭山を越え、笠取を過ぎて、岩間にまうで、或は石山ををがむ。", "もしは粟津の原を分けて、蝉丸翁が迹をとぶらひ、田上川をわたりて、猿丸大夫が墓をたづぬ。", "歸るさには、をりにつけつゝ櫻をかり、紅葉をもとめ、わらびを折り、木の實を拾ひて、かつは佛に奉りかつは家づとにす。", "もし夜しづかなれば、窓の月に故人を忍び、猿の聲に袖をうるほす。", "くさむらの螢は、遠く眞木の島の篝火にまがひ、曉の雨は、おのづから木の葉吹くあらしに似たり。", "山鳥のほろほろと鳴くを聞きても、父か母かとうたがひ、みねのかせきの近くなれたるにつけても、世にとほざかる程を知る。", "或は埋火をかきおこして、老の寐覺の友とす。", "おそろしき山ならねど、ふくろふの聲をあはれむにつけても、山中の景氣、折につけてつくることなし。", "いはむや深く思ひ、深く知れらむ人のためには、これにしもかぎるべからず。", "大かた此所に住みそめし時は、あからさまとおもひしかど、今ま（すイ）でに五とせを經たり。", "假の庵もやゝふる屋となりて、軒にはくちばふかく、土居に苔むせり。", "おのづから事のたよりに都を聞けば、この山にこもり居て後、やごとなき人の、かくれ給へるもあまた聞ゆ。", "ましてその數ならぬたぐひ、つくしてこれを知るべからず。", "たびたびの炎上にほろびたる家、またいくそばくぞ。", "たゞかりの庵のみ、のどけくしておそれなし。", "ほどせばしといへども、夜臥す床あり、ひる居る座あり。", "一身をやどすに不足なし。", "がうなはちひさき貝をこのむ、これよく身をしるによりてなり。", "みさごは荒磯に居る、則ち人をおそるゝが故なり。", "我またかくのごとし。", "身を知り世を知れらば、願はずまじらはず、たゞしづかなるをのぞみとし、うれへなきをたのしみとす。", "すべて世の人の、すみかを作るならひ、かならずしも身のためにはせず。", "或は妻子眷屬のために作り、或は親昵朋友のために作る。", "或は主君、師匠および財寳、馬牛のためにさへこれをつくる。", "我今、身のためにむすべり、人のために作らず。", "ゆゑいかんとなれば、今の世のならひ、この身のありさま、ともなふべき人もなく、たのむべきやつこもなし。", "たとひ廣く作れりとも、誰をかやどし、誰をかすゑむ。", "それ人の友たるものは富めるをたふとみ、ねんごろなるを先とす。", "かならずしも情あると、すぐなるとをば愛せず、たゞ絲竹花月を友とせむにはしかじ。", "人のやつこたるものは賞罰のはなはだしきを顧み、恩の厚きを重くす。", "更にはごくみあはれぶといへども、やすく閑なるをばねがはず、たゞ我が身を奴婢とするにはしかず。", "もしなすべきことあれば、すなはちおのづから身をつかふ。", "たゆからずしもあらねど、人をしたがへ、人をかへりみるよりはやすし。", "もしありくべきことあれば、みづから歩む。", "くるしといへども、馬鞍牛車と心をなやますにはしか（二字似イ）ず。", "今ひと身をわかちて。", "二つの用をなす。", "手のやつこ、足ののり物、よくわが心にかなへり。", "心また身のくるしみを知れゝば、くるしむ時はやすめつ、まめなる時はつかふ。", "つかふとてもたびたび過さず、ものうしとても心をうごかすことなし。", "いかにいはむや、常にありき、常に働（動イ）くは、これ養生なるべし。", "なんぞいたづらにやすみ居らむ。", "人を苦しめ人を惱ますはまた罪業なり。", "いかゞ他の力をかるべき。", "衣食のたぐひまたおなじ。", "藤のころも、麻のふすま、得るに隨ひてはだへをかくし。", "野邊のつばな、嶺の木の實、わづかに命をつぐばかりなり。", "人にまじらはざれば、姿を耻づる悔もなし。", "かてともしければおろそかなれども、なほ味をあまくす。", "すべてかやうのこと、樂しく富める人に對していふにはあらず、たゞわが身一つにとりて、昔と今とをたくらぶるばかりなり。", "大かた世をのがれ、身を捨てしより、うらみもなくおそれもなし。", "命は天運にまかせて、をしまずいとはず、身をば浮雲になずらへて、たのまずまだしとせず。", "一期のたのしみは、うたゝねの枕の上にきはまり、生涯の望は、をりをりの美景にのこれり。", "それ三界は、たゞ心一つなり。", "心もし安からずば、牛馬七珍もよしなく、宮殿樓閣も望なし。", "今さびしきすまひ、ひとまの庵、みづからこれを愛す。", "おのづから都に出でゝは、乞食となれることをはづといへども、かへりてこゝに居る時は、他の俗塵に着することをあはれぶ。", "もし人このいへることをうたがはゞ、魚と鳥との分野を見よ。", "魚は水に飽かず、魚にあらざればその心をいかでか知らむ。", "鳥は林をねがふ、鳥にあらざればその心をしらず。", "閑居の氣味もまたかくの如し。", "住まずしてたれかさとらむ。", "そもそも一期の月影かたぶきて餘算山のはに近し。", "忽に三途のやみにむかはむ時、何のわざをかかこたむとする。", "佛の人を教へ給ふおもむきは、ことにふれて執心なかれとなり。", "今草の庵を愛するもとがとす、閑寂に着するもさはりなるべし。", "いかゞ用なきたのしみをのべて、むなしくあたら時を過さむ。", "しづかなる曉、このことわりを思ひつゞけて、みづから心に問ひていはく、世をのがれて山林にまじはるは、心ををさめて道を行はむがためなり。", "然るを汝が姿はひじりに似て、心はにごりにしめり。", "すみかは則ち淨名居士のあとをけがせりといへども、たもつ所はわづかに周梨槃特が行にだも及ばず。", "もしこれ貧賤の報のみづからなやますか、はた亦妄心のいたりてくるはせるか、その時こゝろ更に答ふることなし。", "たゝかたはらに舌根をやとひて不請の念佛、兩三返を申してやみぬ。", "時に建暦の二とせ、彌生の晦日比、桑門蓮胤、外山の庵にしてこれをしるす。", "「月かげは入る山の端もつらかりきたえぬひかりをみるよしもがな」。"], "P": ["河の流れは常に絶える事がなく、しかも流れ行く河の水は移り変って絶間がない。奔流に現われる\u0001飛沫\u0002ひまつ\u0003は一瞬も止る事がなく、現れるや\u0001直\u0002すぐ\u0003に消えてしまって又新しく現れるのである。世の中の人々の運命や、人々の\u0001住家\u0002すみか\u0003の移り変りの激しい事等は丁度河の流れにも\u0001譬\u0002たと\u0003えられ、又奔流に現われては消えさる飛沫の様に極めてはかないものである。壮麗を極めた花の都の中にぎっしりと立ち並んでいる家々は各々の美しく高い\u0001甍\u0002いらか\u0003をお互に競争し合っている。これ等の色々な人々の住家は\u0001何時\u0002いつ\u0003の時代にでもあるもので決して絶えるものではないのであるが、さてこういう貴賤様々な人々の住家の\u0001中\u0002うち\u0003に不変のものを見出すと云う事は出来るものではなく、昔の\u0001儘\u0002まま\u0003に現在までも続いていると云う住家は\u0001殆\u0002ほとん\u0003んどなく、極めて\u0001稀\u0002まれ\u0003に昔の美しさのある物を発見するのが\u0001頗\u0002すこぶ\u0003る難しいことなのである。この辺に美しい立派な住家があったのだがと見て見るともうその家は去年焼け失せて無くなっていたりする。又こんな所にこんな立派な住家は無かったのにと思って見ると前の貧しい家は焼け失せて現在はこれほどの立派な住家になっていたりするものである。この様に昔お金持であって立派な美しい住家に住んでいた人が今は見る陰もなく落ちぶれて昔の住家に比ぶれば掘立小屋同様の住家に住んでいたりする。こんな運命が人々の歩まねばならないものなのである。", "昔からの知り合いは居ないものかと見て見るとそうした人は中々に見付ける事が出来なくて、所も昔の儘の所であるのに、又そこに住んでいる人々も昔の様に多数の人々が住んでいるに\u0001拘\u0002かかわ\u0003らず、十人の中\u0001僅\u0002わずか\u0003に二、三人しか見出す事が出来ない有様であって、真に人々の歩むべき運命の路のあまりにも変転極まりないのを見ると感動に堪えないものがある。", "人間のこういう運命、\u0001朝\u0002あした\u0003に生れては\u0001夕\u0002ゆうべ\u0003に死して行かなくてはならない\u0001果敢\u0002はか\u0003ない運命、変転極りない運命、こういう事を深く考えて見ると全く、結んでは直に消え、消えては又結ぶ水流の泡沫の如きものではないかと思ったりする。奔流に結び\u0001且\u0002か\u0003つ消ゆる飛沫の運命、それが\u0001詮\u0002せん\u0003ずる所人々の歩むべき運命なのである。", "一体多くの人々がこの世に生れ出て来るのであるが、これらの人々は\u0001何処\u0002どこ\u0003から来たものであろうか。そして又何処へ行ってしまうのであろうか。等と考えて見ると何処から来、何処へ行くかと云う問いに対して答え得るものは何処にも居るものではなく、何処から来て何処へ行くかは永遠に解くを得ない謎であって人々はこの謎の中に生れ、そうして死して行くのである。水に浮ぶ泡が結び且つ消える様に。", "かく果敢なく、解くを得ない運命を歩まなくてはならない人々は又この世に\u0001於\u0002おい\u0003て何を楽しみ、何を苦しんで生きているのであろうか。", "泡の\u0001如\u0002ごと\u0003くに消えなくてはならない儘かの人生の中でどんな仕事に面白味を見出し又どんな事で苦しんでいるのかと多くの人々の答を求めたとすれば各種各様に答が出て決して一つのものにはならず、結局何を苦しみ、何を楽しんでいるのか、また何を\u0001為\u0002な\u0003すべきか等と云う事も一つの永遠に解き得ない謎になってしまうのである。", "長い年月の間に火事の\u0001為\u0002ため\u0003に、地震の為、\u0001或\u0002ある\u0003いは他の色んな変事の為に、立派な美しい家が無くなってしまったり、又お金持の家が貧しくなったり、\u0001貴\u0002とうと\u0003い地位にあった人が\u0001賤\u0002いや\u0003しい身分に落ちぶれたりする、こうした人々やその住家の移り変りの極りない事は\u0001恰\u0002あたか\u0003も朝顔の花に置く朝露と、その花との様なものである。花は露の住家である。露は朝顔の住人である。", "露が先に地に落ちるか、花が先に\u0001萎\u0002しぼ\u0003んでしまうか、どちらにしても所詮は落ち、萎むべきものである。露が\u0001夕陽\u0002ゆうひ\u0003の頃まで残る事はなく、又朝顔とても同じ事、朝日が高く登れば萎むべき運命なのである。人々と人々の住家も所詮は朝顔に置く朝露と、朝顔の運命とを\u0001辿\u0002たど\u0003らねばならないものである。どちらが先に落ちぶれるか、それは\u0001解\u0002わか\u0003らないが所詮は落ちぶれるものなのである。", "自分はこの世に生れて早くも四十年と云う長い年月を暮して来たのであるが、物心が付いてから色々と見聞して来た世間の事には全く不思議なものが数々あるのである。これらの多くの見聞したものを少し思い出して書いて見る事にし様。", "昔の事ではっきりとは覚えていないのだが確か安元三年四月二十八日位であったと思うが、風の物すごく吹いている日で、\u0001遂\u0002つい\u0003には大嵐となった日の事である。京都の東南部の某の家から折り悪しく火が出たのである。何しろ強風の吹き\u0001荒\u0002すさ\u0003ぶ時であったからたまったものではない。\u0001忽\u0002たちま\u0003ちの中に火は東北の方へと燃え拡がって行った。そして遂には朱雀門や大極殿、大学寮、民部省等の重要な建築を一夜の中に\u0001尽\u0002ことごと\u0003く\u0001灰塵\u0002かいじん\u0003としてしまった。", "この大火の火元の某家と云うのは\u0001後\u0002のち\u0003の調査によると\u0001樋口富\u0002ひぐちとみ\u0003の\u0001小路\u0002こうじ\u0003にある住家で、病人の住んでいたものであった。燃え上った火炎は折からの突風に\u0001煽\u0002あ\u0003おられ煽おられて、それこそ扇を広げた様な型になって末ひろがりに広がって行った。火元から遠くにある家々は猛烈な煙の為に全く囲まれてしまって、人々は煙に\u0001咽\u0002むせ\u0003び、呼吸すら全く自由には出来ない\u0001有様\u0002ありさま\u0003であった。炎上している家々の近くの道路は火炎が溢れ出て来る為に人々の通行を全く阻止してしまった。都の大空は炎々と燃え上る炎の為に夜は火の海の如く\u0001真紅\u0002まっか\u0003で、どれだけ強い火がどれだけ多くの家々を燃やさんとしているかを物語っていた。又一方風は\u0001益々\u0002ますます\u0003強くなるばかりで一向に静まりそうにもなく、その強風は時々火炎を遠い所へ吹き飛ばして又新しく火事を起して益々火事は広がって行くのであった。", "嵐と火事の\u0001真只中\u0002まっただなか\u0003に囲まれた京の人々は全く半狂乱でその為す所を知らずと云う有様、皆もう生きた心持もなく、\u0001唯々\u0002ただただ\u0003自然の成り行きにまかせて見ているより仕方がなかった。何をする等と云う頭はまるで働かず、茫然自失、全く手の下し様がなかった。吹き付けて来る煙に巻き込まれた人は呼吸を止められてパッタリと倒れ、人事不省になり、又吹き付ける火災にその身を巻き込まれた人々は直にその場で貴い一命を奪われてしまう事も頻多であった。こんな混乱と危険との間を\u0001幸\u0002さいわい\u0003にも辛うじてその生命を全うして無事に脱出し得た人々でも自分の住家から大切な家財道具を持ち出す事はまるで不可能で、大切な家財が皆火災の為に灰塵とされてしまうのを目の前に見ていた。それでいてどうする事も出来なかったのである。この様にして焼け失せてしまった諸々の家財、道具、或いは宝物、その中には定めし先祖伝来、父祖伝来のものもあったであろうに、それらのものの価はどれだけであったか考えて見る事も出来ない程に莫大なものであったろうと思われるのである。", "公卿の屋敷がこの\u0001度\u0002たび\u0003の大火の為に十六と云う多数も焼け失せてしまった程であるから、まして身分の賤しい素町人達の屋敷の焼け失せた数は数える事も出来ない程に多くあった事と思われる。この大火は京の街の三分の一と云うものを僅かの間に灰にしてしまったのである。", "数多くの人々がこの大火の為にその尊い生命までも落しているのである。これ等の中には青年少年で将来どれだけ偉大な仕事をやったであろうと思われる人々も\u0001尠\u0002すくな\u0003くなかったであろうに、惜しい事をしたものである。人間でさえこんな事になったのであるから、まして畜生である馬や牛の\u0001焼死\u0002やけじに\u0003したものは数知れずあった訳である。人間は本来、色んな愚にも付かない事をするものであるが、とり分けこん度の様に一朝にして\u0001総\u0002すべ\u0003てを灰塵に帰すると云う様な危険性の多分にある都会の中にあって、一朝にして灰となる運命も知らぬげに、自分の住家に、大層なお金を掛けて、ああでもない、こうでもないと色々と苦心して、建てる事程間抜けな愚かしい事はないとしみじみと思い当った。こうして苦労して建てても一朝火炎に見舞われれば直に灰塵となってしまうのであるのに、全く建物にお金を掛けたり苦労する程馬鹿らしい事はない。", "治承四年の四月の頃には又大きな旋風の起った事があった。京極のほとりに起って六条のあたりまで吹いたものであった。全く物すさまじい\u0001勢\u0002いきおい\u0003のもので、三、四丁も吹いて行く間に、ぶっつかる所の大きな\u0001家\u0002うち\u0003でも、小さなのでも、どんな家でも殆ど\u0001覆\u0002くつがえ\u0003したり、破壊したり、破損したりしたものであった。それ程すさまじい勢に吹きつのった事であった。", "旋風に巻き込まれてその儘地上の上にペシャンコに倒されてしまったものや、\u0001桁\u0002けた\u0003と柱だけが残って障子や、壁はすっかり吹き抜かれてしまったのもあった。そうかと思うと門を吹き飛ばして四、五丁も先に持って行ってしまったり、垣を吹きとばしてしまって隣家との境を取りのけてしまって庭続きにしたりして方々にとんだ悲喜劇を起させた。家々にある色んな家財道具の類も根こそぎにすっかり空に吹き上げてしまった。屋根を覆っている所の\u0001檜皮\u0002ひわだ\u0003\u0001葺板\u0002ふきいた\u0003の類は丁度冬の頃に木の葉が風に舞い上る様に乱れて空に吹き上げられた。", "煙が都の空を全く覆ってしまったのではないかと思われる程に都の空には塵や埃が舞い上って\u0001天日\u0002てんじつ\u0003為に暗きを感じた程であった。人々の話し声等は荒れ狂う強風の為に全く掻き消されてしまって聞える所の騒ぎではなかった。都の街々に聞えるものは唯風の吹き荒れるすさまじい音響のみであった。その風の荒れる様のすさまじさはまるで伝え聞く地獄の業の風が現実の世に吹くのかと思われる程のものであった。吹き倒された家、破損された家、それ等家々の無残な様子は全く目も当てられない程である。又住家等の破損した場所を修繕し様として外に出て仕事をしているとそこへ何か大きなものが吹き付けて来て哀れにも不具者となると云う様な人々も数多くあった。\u0001真\u0002まこと\u0003に気の毒な人々である。この旋風は又西南の方に向って動いて行って\u0001其処\u0002そこ\u0003に住んでいる人々に対しても前同様に色々な損害を与えて人々を悲しませた。春夏秋冬を通じて風が吹かない時は無いものであるが、何時もの風は風情のある心持の好い風であるのに今度の風はすさまじい風で、数多くの損害を人々に与えたのである。こんな風は何年かの間に一度とあるか無きかの風であって真に珍しい例外とも云うべきものである。今度の大惨事の事を深く考えて見るとこれはきっと天の神様が地上に住む人々に対して一つの警告として与えて下さったものだと考えざるを得ないのである。", "治承四年六月頃の出来事であったのだが、\u0001俄\u0002にわ\u0003かに都が他の場所に移った事があった。この事が非常に急に、不意打ちに行われたので都の住人は驚き\u0001且\u0002かつ\u0003は狼狽したのであった。", "大体京都に都が定められたのは嵯峨天皇の御時であって、もう既に四百余年も経っているのであるから、何か特別の事情の無い限りはそう\u0001易々\u0002やすやす\u0003と都を改める等と云う事はあるべからざる事なのである。だから人々はどんな特別の事情があるのかと心配して、その心配の余りに平和であった人心が乱されてしまったのも真に無理からぬ事ではあった。けれども人々の心配も何もあったものでなく、遂に天子様はもとより、大臣、公卿達も皆\u0001悉\u0002ことごと\u0003く新しい都である福原へ移転してしまった。世に重要な地位を占めて働いている人々はもう誰一人として古い都の京都に住んでいる人は居なくなってしまった。\u0001位\u0002くらい\u0003\u0001人身\u0002じんしん\u0003を極める事を唯一の希望とも理想ともする人々や、天子様の御覚えの目出度い事を願っている人々は一日も早く古い都を捨て去って新しい都の福原へ移り住む事を一途に心がけた。けれども世に取り残されて位もなく何等の望も、理想もない人々はこの出来事に対して悲しみ、愁えながらも古き都を捨て得ずに淋しく残っていたのである。", "高位高官の人々、富有な人々の居なくなった古き都の有様はあまりにも物淋しかった。軒並にその美しさを争っていた堂々たる住家は、日が経つにつれてだんだんと住む人もなく手入も行き届き兼ねて荒廃し果てた。又その住家の中には打ち壊されて福原へと\u0001筏\u0002いかだ\u0003に組まれて淀川に浮べ送られて行ったのも多い。\u0001毀\u0002こわ\u0003れた屋敷の跡は見ている間に畑になってしまった。真に昔の面影すら見る\u0001術\u0002すべ\u0003もない有様であった。こんな大きな変事は人心にも多大な影響変化を与えずには措かなかった。見る見る中に都会人としての優雅な気持はすっかり無くしてしまった。そんな気持が色んな所に現れたものであるが\u0001先\u0002ま\u0003ず昔の様に牛車等に公家達が乗ったのも、もうそんなものには乗らずに武家風に馬に乗ってその敏捷な所を好むと云う様な所に現れて来た。これを見ても昔の如く優雅なのんびりとした風はなくなってしまった。又その所領の望みでも今は平家に縁故の多い西南海の所領を人々は目ざしたけれども新都に遠く離れた東北の庄園は誰も望むものはなくなってしまった。この様に総てのものが変ってしまったのである。", "私はふとした偶然の事から摂津の国の福原の新しい都の有様を見る機会を得たのでその状態を述べて見ると、先ずその広さと云うものは京都に比べると実に狭いもので、京都に習ってその市街を碁盤の目の様に区劃する事さえ出来ない有様なのである。北の方は山になっていて高く、南の方は海に面して低くなっている。そして海岸に近いので浪の音が絶えず騒々しく響いて来るのである。海から吹いてくる潮風が殊の外に強い所であまり恵まれた土地と云う事が出来ない有様である。さて最も重要な皇居は山の中に建てられてあった。ふとその建物を見て斉明天皇の朝倉の\u0001行宮\u0002あんぐう\u0003の木の\u0001丸殿\u0002まろどの\u0003もこんなのではなかったかと思えて考え様によっては存外に風情があって、風変りなだけに雅致のあるものであるかも知れないとも思われた。こう云う新しい皇居のお有様、新しい都の状態であった。", "京都の方では毎日毎日引越に人々は忙しかった。多くの住居は毀されては筏に組まれて河を下って運ばれるので、さしもに広い淀河も\u0001如何\u0002いか\u0003にも狭い様に思われる程筏で一杯になってしまった。この様にして多くの家が福原へと運ばれているのであるが、福原の土地を考えて見るとこちらから送られた程には家が建っていないからまだまだ\u0001空\u0002す\u0003いている土地が多くあった。建ててある家の数は少ししかない。一体あれだけ、河幅が狭く見える位に送られた家は何処に建てられるつもりか又何処に建てているのか一向に見当も付きそうにはないのであった。", "京都は益々、日々と荒れ果てて行く、そして新しい都福原が都として完備するにはまだまだ日数が必要なのである。こんな時勢の間に住む人々の心持の落ち着こう道理もない。まるで青空に浮び漂う雲の如くに風の間に間に動いて真に不安定そのもの、人々の心は暗かった。元から福原に住んでいた人々は新しくお天子様と一緒にやって来た官人達の為にその土地を奪われてしまって嘆き悲しんでいる。又新しくやって来たそれらの官人達は自分達の住家を建てなくてはならないので、その面倒な仕事の為に苦しんでいる。どのみち好もしい事どもではないのである、ふと往来を行き交う人々に目をやって見ると牛車に乗るべきである所の貴い身分のものがそんなものには乗らずに馬に乗ったり、\u0001衣冠\u0002いかん\u0003\u0001布衣\u0002ほい\u0003を着ていなければならない\u0001筈\u0002はず\u0003の大宮人達は新興の勢力に媚びて武家の着る筈の\u0001直垂\u0002ひたたれ\u0003などを着て大宮人の優美な風俗を無くしてしまい、そうして遂には都らしい優美に、雅致のある風俗は見る見る中に無くなって唯もう田舎めいた荒々しい武士と少しも変る所のない真に情けない有様となった。", "ほのかに聞き伝える所によると昔の聖天子様の御代には御政治の中心点は一般庶民を憐れむと云う所にあった様である。民草達が貧乏の為に苦しんでいる時とか、何かの変事の為に苦しんでいる時などは尊貴の御身であらせられながら御自身のお住いの皇居の事などは少しもお構いなさらずに、軒の端に不揃いな\u0001茅\u0002かや\u0003の端が出ていてもそれさえお切りにならせられずに、その上に民草が食べるお米のない時には年貢さえも免除された程なのである。こうした御事は世を平和にお治めなされたいという\u0001忝\u0002かたじけな\u0003い大御心から出るのであって有り難いものなのである。所が現在の有様はどうであろうか、やれ都の移転だとか何だかと云っては人心を平和に治める所か不安のどん底に落し入れている有様ではないか、もっともこれは清盛が無道の極端な専横の現れなのであるが、何にせよ昔の聖天子様の御代の事を考え合せて見ると実に隔世の感に堪えぬ有様は、真に嘆かわしい事である。", "養和の頃の出来事であったと覚えているが\u0001何分\u0002なにぶん\u0003にも古い事ではっきりした時は云われないのだが、その頃の二年の間と云うもの実にひどい飢饉のあった事があった。実に惨憺たる\u0001状態\u0002ありさま\u0003を呈した事があった。春から夏にかけての長い間に一滴の雨すら降らず、毎日毎日の日照り続きで\u0001田畑\u0002でんぱた\u0003の作物は皆枯死してしまう有様であった。それかと思うと秋になると大風があったり、大雨が降って大洪水になったりして全く目も当てられない様子で穀物等の収穫はまるで無く、唯\u0001徒\u0002いたず\u0003らに田を耕し畑に種を蒔いたのみでその甲斐はなく、秋の忙しい苅入れ時には何もする事がなく、全くの、前代未聞の災難が起ったのである。だから一年分の米もなく、食物もない有様である。", "食物の無い先祖伝来の土地の生活、それは苦難の連続でなければならない。だから人々はその先祖代々住みなれた土地を見捨ててしまって諸国を放浪して歩いたりする様になった。またある人々は家や耕地を\u0001全\u0002まる\u0003で見忘れたかの様に見捨ててしまって山の中に入り込んで暮らしたりしていた。山の方がまだまだ木の実等の食物があったからであろうと思われる。", "こうした真に惨憺たる状態にあっては人々は自滅の途を辿るより他に道がないと天子様の方でも御心配にならせられて色々な御祈祷や特別に霊験あらたかなと云われている修法等を執り行わせられたものであるが、一向にその\u0001験\u0002しるし\u0003も現れては来なかったのであった。", "元来京都の人々は何事によらずその物資の供給を総て田舎から受けているのであるから、その供給者である田舎が天災の為に物資が全然取れなかったのであるから、京都の人々は\u0001勿論\u0002もちろん\u0003物資の不足を告げる様になって来たのである。京都は全く物資の供給者を失った事になったのである。こうなると困るのは京都の人々である。第一に食物を得る事が出来ない。", "それでその食物を得る為にとうとう恥も外聞もなく、家財道具を捨て売りにしてはお米を持っている人々の所へ買いに行くのだけれどもこう物資の不足している時に大事なお米は売れないとあって、とても高い値でなければ売ってくれない。こう云う状態だから、どれだけお金があっても宝物があってもどうにもならない有様である。だからだんだんと日の経つにつれて乞食共が多くなって来て、路傍に一杯群がって食を乞うその哀れな叫び声が道に満ち溢れて聞えて来る様になって来たのである。しかし養和元年もこの様な惨憺たる有様の中にどうやら暮れてしまったのである。", "明けて養和二年、人々は今年こそは物資の豊かな、平和な世に立ち直るものと期待していたのであるが、その期待は見事に裏切られてしまった。と云うのはこういう飢饉の惨状の上に、またその惨状を上塗りするかの様に疫病が流行し出したのである。人々の惨状は目も当てられず、益々ひどいものとなって行ったのである。元の様な平和な世は何処へ一体行ってしまったのかとうらみたくなる位であった。", "人々は飢饉で弱っている身に疫病の難に\u0001罹\u0002かか\u0003り、多くの人々はその生命を落して行った。一方物資の欠乏は益々ひどく人々は苦難のどん底に落ちて行った。この有様は丁度水の少い所に沢山の魚を入れた様なものであって、所詮は皆その生命を奪われる悲しい運命にあったのである。遂には相当な身分の人達でさえ\u0001脚絆\u0002きゃはん\u0003に足を包み、顔を笠にかくして、恥しさを忍びながら軒並に食を乞いながら歩くと云う有様になった。この様に食を乞いながら歩いたとて食を与えてくれる家とてあろう筈がないので、人々は疲労\u0001困憊\u0002こんぱい\u0003その極に達してしまって、今そこを歩いていたかと思うと\u0001直\u0002ただち\u0003にバッタリと\u0001殪\u0002たお\u0003れてその貴い生命を落すと云う事は、もう\u0001極\u0002ご\u0003く普通に有り得ると云ういとも哀れな状態にまでなってしまった。だから街路には何処へ行っても行き倒れた哀れな人々の死骸が見出された。あちらの土塀の前、こちらの門の前と云う様に全く目も当てられない有様だった。その上にこれらの餓死し行き倒れた人々の\u0001屍\u0002しかばね\u0003を取かたづけ様とするものがないので、日が経つにつれてだんだんと屍は腐って行って、型が崩れ、悪臭は\u0001芬々\u0002ふんぷん\u0003として街中に溢れていたのである。街がこの様な状態なのであるから、鴨の河原などに至っては、実に数多くの屍が一杯に溢れていて、その為に牛車や、馬車の通る道すらもないと云うひどい有様であった。", "山へ行って薪を取って、これを都の人々に売ってその日の暮しを立てている賤民や、樵夫達は飢の為に最早その毎日毎日の仕事すら出来ないのである。その為に都の人々は薪が不足して来たのである。だから全くのよるべのない一人者等は、自分の住家を破壊しては薪にこしらえて、これを薪に困っている人に売ろうとするのであるが、一人が街に出て売って来る代価だけでは、その人一人すらの生命を保つだけの価にもならないと云う悲惨な有様である。それにも増して奇怪と云うか、哀れと云うか、真に変な事があった、と云うのはこうして薪の不足を補うべきものの中に立派な塗のしてあるのや、金銀の箔の付いた材木が時々混っている事であった。これは真に奇怪千万と色々と考えて見ると、いよいよ飢の為に困った人々が、売るべきものは皆売りつくしてしまったものだから、寺院の中へこっそりと入って行って仏像を盗んで来たり、御堂の道具をむしり取ったりして、それを薪にして売りに出したものだと云う事が解って来たのである。物資の欠乏がかくまでに人の心を濁らせるものかと暗然たるものがあった。こうした大変な世の中に生れ合したばかりに楽しかるべき人生に、こうした\u0001悪濁\u0002あくじょく\u0003の姿を見なければならないのは真に情けない事である。", "世を挙げての悲惨な中にもまして最も哀れであるのは、お互に愛し合っている人々の運命である。相愛の夫婦、深く愛している夫を持ち妻を持つ人々は自分は\u0001兎\u0002と\u0003に\u0001角\u0002かく\u0003として先ず愛する夫へ、愛する妻へとなけなしの食物すらも与えるのが人情である。こうした人々は必ず深く愛する者が先に餓死しなくてはならないのはあまりにも明白な事である。", "この事は親と子の間には最も明白に現れるのであった。親を愛さない子は世にあるとしても、子を愛さない所の親は無い筈である。だから親は必ずその得た食物を子供に与えてしまうので、親は必ず先に餓死しなくてはならないのである。真に最も強き愛は親の子に対する愛と云わねばならない。こうした変事の時には最も明らかに現れるのである。母親の乳房を求めて泣く子供が方々に見られるのであるが、既に母親は死しているのに、その屍に取り付いて泣く赤んぼのいたいけな姿は、この世での地獄と云っても決して言い過ぎでない様な気がするのである。全く京の街々は昔の平和はどこへやら、今は生きながらの地獄の責苦に遭っている有様である。", "その頃\u0001仁和寺\u0002にんなじ\u0003に\u0001隆暁\u0002りゅうぎょう\u0003法印と云う出家があった。この人はあまりにも悲惨な世の中の有様を見、またかくも多くの人々が日々に死して行くのを嘆き悲しむのあまり、何とかして死した人々に仏縁を結ばせてやりたいものだと発願したので、毎日毎日街を歩き廻って屍を発見する度に、その額に阿の字を書いて極楽往生を念じたのであった。こうして阿の字を書いて成仏させた人数はどれ程あったかと云うと、四月と五月の二ヶ月の間に阿の字を書いた死骸の数は、都の一条よりは南、九条よりは北、京極よりは西、朱雀よりは東の、その間だけでも驚くなかれ総て四万二千三百余もあったと云うのだから、どれだけ大きな変事であったかと云う事が解ることと思われる。二ヶ月と云う短い間にさえこれだけの死者を出しているのだから、ましてその前後に於て死している人々の数を入れて考えて見ると、莫大なる数になり、都の住人の総てが死したのではないかとさえ思われたかも知れない。その上に河原や、白河や、西の京の死者をもそれに加え、全日本の死者の数をも加えて行ったならば全く際限もない、途方もない数になったのは云うまでもない事である。その昔崇徳天皇の御代の長承の頃にも、この様な飢饉のあったと云うことを私は聞いているのであるが、その時の状況は\u0001目\u0002ま\u0003のあたり見たのではないから全く知らない。が今度の飢饉は目のあたりにその惨状を見せられて、如何に飢饉のひどいものであったか、今度のは全く稀有の椿事であり、前代未聞のものである事には違いなく、全く\u0001以\u0002も\u0003って何とも言い得ぬ哀れな出来事であった。", "同じ頃の出来事なのであるが、もう一つその上に大きな地震と云う災難に見舞われた事があった。その地震と云うのが今まであったどれよりも強く、従ってまたその被害も常日頃の様なものではなく実にひどいものであった。大きな山は地震の為に崩れて来て、下に流れている河を埋めてしまったり、海の水は逆行して岸辺に上り、更に人の住家のある所まで流れて来たりした程であった。又土地が二つに割れてその間から水が湧出して来たり、大きな岩がゴロゴロと谷間にころげ落ちたりして、いやもう大変な物すごさであった。海に出ていた船は地震の為に、大波の為に木葉の如くに翻弄され、道を歩いている人々や、馬や牛などはひょろひょろとしてその足場を失って倒れたりする始末で大変な騒ぎであった。", "都にある所の立派な家や、大きな家や、小さな家は一軒として満足なものはなく、総てが倒されてしまっている。神社や仏閣等も数多くその立派な建造物を倒されている有様である。完全に倒されたのや、半分倒された家々のあたりには、まるで盛んな煙の様に塵や灰が立ち登っている。地面が、ゆり返しの地震にゆれたり、大きな家が倒されたりする時には、雷様のなる様なすさまじい音がするのである。", "人々は落ち付く所もなかった。家の中に居れば今にも家が圧しつぶされはしないかと心配でじっとしてはいられないし、外へ走り出れば地面が割れて来る始末、何処にも行き様がなかった。もしも空へ逃げる事が出来さえしたならば、一番好いのだが、情けないかな人々には羽がなくてそれすら出来ず、まことに又飢饉以上の情けない哀れな状態と云うべきだ。", "もしもこの場合に竜にでも成り得たならば、雲に乗って昇天すると云う手も考えられはするのだが、情けない事には竜ではなく人間なのだからどうする事も出来ない有様である。", "世の中には恐ろしいものは他にも幾らもあるのだけれども、地震の大きくて強いの程、恐ろしいものはないものだとつくづく悟る事が出来た次第である。人々の落ち付き場所もなくなる程に強く激しく震動する所の地震は、しばらくの後に止んでしまったのであるが、その後に来る所の余震と云うものは中々に止みそうもなかった。その余震さえもが普通には誰でもが驚く底の強さのもので、これ位のが日に二、三十度は必ず起ったのである。しかしだんだんと日が経ち、十日過ぎ二十日過ぎ、となって行く中に、さしもにひどかった余震もだんだんと度数が少なくなり、間を置く様になって来た。日に四、五度の少なさになり、二、三度になって、遂に一日置きになり、二、三日に一度とだんだんに少なくなっては行ったものの、大体に於て三月と云うものの間は余震がずっと続いていたのである。火水風は絶えず人々に災害を与えているものであるのだが、大地はあまり災害を与えるものではないものなのに、今度ばかりはちと見当違いにひどく大きな災害を与えたものである。今度の地震と昔の\u0001斉衡\u0002さいこう\u0003の年間にあった地震で、東大寺の大仏様の頭を地に落したと云って騒いだ時のと比較して見ても、今度の地震から見ると、そんなのは物の数でもない小さいものなのであった。それ程に今度のはひどかったのである。", "この様に色んな災難に遭遇して見ると、人の生活と云うものが如何につまらなく、人生そのものさえ味気ないものに思われてきて、せめてこの世に居る間だけでもとお互い相助け合い、気持好く、私利私慾を貪る事なく暮したいものだと人々は考える様になって来た。少しは濁っていた人々の心も打ち続く災難の為に改まったのであろう。けれども人々の心持なんて\u0001当\u0002あて\u0003になるものではなく、だんだんと日が立ち月が経ち年が経つにつれて、そう云った大きな災害のあった事など何時の間にか忘れてしまって、お互に助け合うの、お互に、私利私慾を貪らずに気持よく暮らそうなんて云う気持はもうどこへやら行ってしまって、又元の私利私慾のみを考える様になり、\u0001嫌\u0002いや\u0003な世の中にだんだんとなって行ってしまった。真に情ない事である。", "総て世の中は無情であって、中々に住み難い所であると云う事は上述の通りであり、又自分自身の運命の果敢なく頼りない事も同じであり、その住家さえ\u0001何時何時\u0002いつなんどき\u0003どんな災害に見舞われないとも限らないのも同様のことである。まして人々はその上に住む場所や、身分に応じて世の絆の拘束の為にどれ程に悩んでいる事か知れやしない。この様に世の中はむずかしく住み難い所なのである。一方には自然の災害があり、一方ではお互が愛し合う事もなく一人一人が勝手に暮らしているこんな世の中は全く地獄も同然と云っても好いのだ。", "住む場所にした所で、家のぎっしりとつまっている所の狭い街の中に住んでいるとしたならば一度猛火に遭遇した場合には必ずその\u0001災\u0002わざわい\u0003を受けなければならないのだし、それが嫌だと云ってずっと街を離れた田舎の方に住むとして、火災の難は\u0001脱\u0002のが\u0003れるとしても、一寸外出したり散歩したりするにも道路の悪い田舎道を長く歩かねばならぬと云う不便なこともあるし、あまり人里離れた場所ではしばしば盗賊に襲われると云う事も覚悟しなければならないのである。これでは落ち付いた暮しも出来たものではない。", "権勢のあるものはその現在持っている権勢では決して満足していないで、もっと強い権勢をと望んでその為に色々と苦労をするのだし、それかと云って何らの権勢もなく、身分も低くて孤独なものは人々の軽蔑の対象となって苦しまなければならず、又財産があまりに沢山あると日夜盗賊に襲われはしないかと心配して夜もあまり落ち付いては寝られないであろうし、それかと云って貧乏であって見ればその日の食の為に日夜心配し苦労しなければならないであろうし、これも又相当に苦しい事である。それかと云って人のお世話になっていれば自分自身は何だかその人の奴隷の様に扱われて苦しまなければならない。かと云って人に情けをかけて世話をしてやるとしても又その情けに引かされて一苦労しなければならず、為す事総てがこの有様では苦痛の種となってやり切れやしない。世俗一般の人々が普通にやっている生活の法則、道徳律等を守って生活しようとすれば何処かに空虚な所があって本心からこれで満足だと思う事がなくて苦しいし、そうかと云って普通の人々の生活を全く離れて自分の思っている通りに生活すれば自分の本心は非常に満足に思うのであるが世間の人々から狂人扱いをされてこれまた苦しまねばならないのである。こう考えて見ると\u0001如\u0002ど\u0003んな事をしても苦しまなくてはならない世の中にあって自分は一体どうすれば苦しみもなく落ち付いて暮らす事が出来るかと全く解らなくなって来る。何を為し、何処に住めば一体私の心は永遠の平和を得、本心の満足を得、落ち付いて生活する事が出来るのであろうか。つまる所は私はまだまだこの俗世に執着を感じているのではあるまいか。もしそれだとするならばこの俗世を脱れる事が最も私の生活に満足を与え、平安を与え、落ち付きを与えてくれる事になるのかも知れない。", "私は父方の祖母の家督を継いでその家屋敷をも受け継いでそこに住む為に、祖母の永く住んで居た土地に永く居たのであるが、家族の者に先だたれたり、色んな不幸が打ち続いてあった為にすっかり私は元気を失ってしまい、遂にはそこに住んでいると色んな過ぎ去った不幸を思い出すので嫌になってとうとうその土地を見捨てる決心をしてしまった。そうして自分はもう俗世では決して満足が得られないのでこれをも捨ててしまって人の来ない所に小さい\u0001庵\u0002いおり\u0003を作って住む事に定めたのである。その時私は丁度三十歳であった。この庵は祖母から受け継いだ家と比較すればその十分の一位のものでまことに小さいものであった。それでもその中に自分の居間だけは作る事が出来たのであるが住家と名付けるだけの部屋を作る事は出来なかった。ささやかな\u0001籬\u0002まがき\u0003を作ったけれども、これを飾る所の立派やかな門は作る事が出来なかった。竹を柱にして車を入れる所を作って居た。がこの庵は少し風が強く吹きでもすると吹き飛ばされはしまいかと心配になり、又その上に雪でも荒れ狂ったならば何時圧しつぶされてしまうか解らないと云う様な\u0001真実\u0002まこと\u0003に以って危険千万な建物なのである。その上に河原の近くに位置している為に洪水が出たとすればひとたまりもなく圧し流されてしまう危険があり、あまりに人里離れた土地故に盗賊の心配又大変なものである。こうして俗世を脱れて来ても色々な心配は常に絶えるものではないのである。", "心配事や苦しい事ばかりが世の中には多くて少しも落ち付いて暮らす事も出来ず、まことに住み難い世の中だ、嫌な世の中だと、何だと不平を云いながらも私は既にもう三十年と云う長い間この苦しい、つらい世の中に堪え忍びながらも住んで来たのである。そしてその間にあった色々な出来事や、嬉しい事よりも悲しい事の多かった事、思い掛けない災難に遭ったこと、失敗した事等によってしみじみと自分の運命の情けない事を悟る事が出来た。それでもまだまだ全く世を捨てる事は出来なかったのであるが、遂に五十歳の春には全く家を捨て、苦しい世を捨て、全くの遁世を決心してそれを実行したのである。", "もとより私は孤独の身で妻や子はないのであるからそうした家族の愛に引かされると云う事は全然ないのだからそう云った事には全然悩まされる事もなかった。又高位高官や、貴い官職や、沢山の俸給等と云うものには全然用事のない身であるのだから何一つとして俗世に引き付けられる様なものもなく、大変に楽に世を捨てる事が出来たのである。", "こうして全くの遁世の生活を、人里離れた大原山の雪深い所に送る様になってからもう長い間の時が経ち、何回かの春秋を送り迎えした\u0001解\u0002わけ\u0003である。", "もう齢も六十近くなり、あともう余命\u0001幾何\u0002いくばく\u0003もない時になってから一つの新しい住いを造って住んだ事があった。丁度これは遂に行き暮れた旅人がやっとの思いで一夜の宿りの場所を見付けてほっとした様なものであり、又これは年老いたかいこが繭を作って籠る様なもので真にはかないものではあるが何か心楽しいものではあるのである。この新しい住家は以前に造って住んでいたものに比ぶればその百分の一にも及びも付かない、小さいものではあった。こう云う風にだんだんと年を取って行くにつれて自分の住家までがだんだんと狭くなって行く、何だか如何にも自分の運命そのものの様に思われて淋しい。", "現在自分の住家はどんなものであるかと云うと世間に普通一般に住家と言われているものと比較すればそれは、もう住家と云う事さえ出来ない様なちゃちなものである。がこれで自分一人が住むにはまことに相応していて心持の好い住家である事には間違いはないのである。広さは僅かに一丈四方と云う小さなもので高さもそれに相当して七尺に満たないものなのである。一体私は何処に住まなくてはならないと云う考えは全然無いのであるからここが好いとかあそこが好いとかなんて事は少しも考えないで唯気の向くままに何処へでも土台を組み、屋根を組んで板と板との継ぎ目には掛金を掛けるのみで至って粗末なものではあるが、それだけは何時でも気の向く所に至って簡単に建てられると云う便利があるのである。だから建ててしまってからでもそこに何か気の向かない事でもあれば直に壊してしまって他の場所へ移って行くのである。", "他の場所へ移るにしても少しの費用しか要らないのである。せいぜい車が二輛ばかりあれば結構なので、この車の借賃さえ支払えば労力は自分で出来るのだから至って易々と引越しも出来るのである。", "現在の日野山の草庵を建ててから後にその草庵の東側に粗末ながらも三尺余の\u0001庇\u0002ひさし\u0003を取付けて\u0001日除\u0002ひよけ\u0003にして、その下で柴を折ったりするのに楽な様にした。南には竹の縁側をこしらえたり、北に寄った方に障子を隔てて阿弥陀様の絵像を安置してその傍に普賢様の像をかけ、その前に法華経を置いた。西の端には物を置くのに便利な様に\u0001閼伽棚\u0002あかだな\u0003を造ったりして色々と住居らしい設備をして行った。自分の寝床には東の端に\u0001蕨\u0002わらび\u0003の穂を取って来て敷いて置いた。西南の方には竹のつり棚を造った。それは真黒な皮の籠三つばかりを置く為でありその籠の中には幾冊かの和歌の書物や、音楽の書物、又は「往生要集」等の抜書したものが入っている。これはつれづれなる折に読みかつ慰めにする為である。その傍には「おり琴」と「つぎ琵琶」と名付けてある琴と琵琶とを一張ずつ立て掛けて置いた。上述の如きものが現在の私の住いである。", "住家の周囲の景色はどんなものかと言うと、南の方には石で造ってある水溜へ水を引く為の懸樋が造ってある。毎日の必要な品である薪は直ぐ近所に森があるので少しも苦労する事もなく集めて来る事が出来るのである。直ぐ傍には\u0001外山\u0002とやま\u0003と云う山があるのであるが、この山への道にはまさきかずらが、一面に生い茂っていて、全くその道を埋めてしまって登るのには少し困難を感ずる様である。谷間には鬱蒼たる草木が繁っているので少し暗さを感ずる程ではあるが、西の方はからりと打ち開けているので、西方にあると云われている浄土の事や、仏様の事を、そちらの方を向きながら黙想するには真に好い場所である。", "春は藤の花が谷間に一面に咲いて紫の雲が棚引いている様で全くうっとりとする様な景色が西の方に見られるのである。", "夏が来れば\u0001郭公\u0002ほととぎす\u0003がしきりとあの哀切な声でなき、昔の人の言った様に、死出の旅路の道案内をすると云われているこの鳥の鳴き声は何だか自分が死んだ時には必ず道案内をして極楽往生をさせてやると約束している様に聞かれて真にうれしく感ずるのである。", "秋はひぐらしが山一面に鳴き出して私にその悲しげな声を聞かせてくれる。その声は私にこの世のはかない運命に対する悲歌を聞かせてくれる様な気がして何だか物悲しく物思いに沈ませるのである。", "冬になると全山雪に覆われてしまう時が時々あって、しみじみと雪の山の美しさを味わわせてくれるのである。又降った雪がだんだんと消えて行って無くなってしまったり、又降って積ったりするのを眺めていると、人間の罪悪と云うものも丁度この雪の様に積っては仏様の大きな御心によって浄めて失くなったり、又罪を犯して又浄められたりする有様を想い出さずにはいられないのである。", "毎日毎日仏様にお念仏を申しているのであるがどうしてもそれがおっくうになったり、又仏様への読経が大儀で仕様のない時には自分から怠けて見たり、お念仏も、読経をしない時さえもあるのだが、そうしたと云った所でここには誰も居ないのだから、怠けた事を恥しいと思う様な友も居ないものだからつい怠けてしまうのである。こうした人里離れた山の中にたった一人で暮しているのだから、自然に無言の業をしなければならないのだし、又自分から必ずしも仏のお\u0001戒\u0002いましめ\u0003を守ろうと勉めている解ではないのだがこんな山の中では仏様の戒律を破る様な誘惑は全く無いのであるから自然と戒律を守ることになってしまうのである。何も聖人、君子に成ろうとしているのではないけれども話す相手とてもないこんな所では自然と無言の行を為す事になり又自然と仏様の道を行う様になってしまうのであって何も自分からの助力でこうなったのでは決してないのである。", "あまりに退屈で仕方のない時には岡の屋のあたりを通る船を眺めては、船の後に残る泡の消えたり現われたりするのを見て人間の運命の果敢なさを考えたりする事もある。又古人の\u0001満沙弥\u0002まんしゃみ\u0003が行った所の風流を真似て歌を詠んで見たりするのである。又\u0001夕\u0002ゆうべ\u0003ともなって夕風が桂の樹にあたってさやさやと樹の騒ぐ時には\u0001潯陽江\u0002じんようこう\u0003の夕景色を想ったりするのである。時には桂大納言に真似て「秋風」と云う曲を琵琶で弾いたりすると松風の\u0001音\u0002ね\u0003がこれにまるで和する様に聞えてくるのである。「流泉」と云う曲を弾くと谷間を流れる水の音がこれに和するかの様に聞えて来るのである。私の琵琶を弾ずる技能は決して上手であるとは言い得ないのであるが、誰の為に弾くと云う事もなく、唯自分で弾いて自分で楽しむのだからこれで充分なのである。自分はその曲を弾いて爽かな気持になって落ち付いて自分の生きている事を楽しみ、山の孤独の淋しさを慰められればそれで結構なのである。", "草庵から少し行った山の麓に一つの小さな小屋があってそこには山番の人が住んでいるのである。そこには一人の子供がいて、その子供が時に私の庵を訪ねて来て私と話し合うのである。まあ私の庵の唯一人の客人と云っても好いのである。話す事も別段に無く、それかと云って為す事もない時にはこの子供を友としてその辺の山を逍遥するのである、その子供は十歳で私は六十の坂を越している年寄ではあるが、年こそ違っているけれども二人で山を歩いてお互に楽しむと云う事には少しも差しつかえはなく、全くの好い友達同志なのである。ある時には山を歩きながら草花を取ったり、岩梨を取ったりするのである。また時には\u0001零余子\u0002ぬかご\u0003を拾ったり、\u0001芹\u0002せり\u0003をつんだりする時もあるのである。そんな事にもあきた時には山麓まで行って田にある所の落穂を拾って穂組を造ったりするのである。又あまりにお天気の好い和やかな日には峯に登って見て、遠く古里の空を眺めたり、\u0001木幡山\u0002こはたやま\u0003、伏見の里、鳥羽、\u0001羽束師\u0002はつかし\u0003等の辺を見渡したりするのである。こうした景色の勝れた山々は誰と云ってこれを専有する人がないので、心一杯に楽しむのには何の障りもないので真に心楽しい事である。心が朗らかであって少しも歩き疲れると云う事のない時には遠くへ行く事もあるのである。そんな時にはすみ山を越えて笠取を過ぎて行って岩間の神社に参詣をして石山にもお参りをすることになっているのである。もう少し遠くの方にある粟津の原に行って\u0001古\u0002いにしえ\u0003の蝉丸の住んだと云われている仮屋の廃墟を訪ねて蝉丸の霊を慰めたり、\u0001田上\u0002たなかみ\u0003川の彼方にある所の猿丸太夫の墓所にお参りする事などもあるのである。こうした遠出の帰りには季節季節に従って春は桜の花の小枝を折り帰り、秋は楓の一枝を折り帰る。又は一束の羊歯を、一籠の木の実を取って帰って仏様にお供え申したり、又自らの食料にしたりするのである。", "月の美しく冴え渡った夜には、月光美しく射す窓辺によって昔お互に付き合った古い友達の事を思い出しながら、悲しげに月に叫ぶ猿の泣き声を聞いたりすると思わずも涙の眼に浮ぶ事さえもある。", "\u0001草叢\u0002くさむら\u0003にいる蛍の灯はまるで\u0001真木島\u0002まきしま\u0003の\u0001炬火\u0002かがりび\u0003ではないかと思われるばかりに沢山谷間に輝いていて私の淋しい心を慰めてくれるし、又\u0001暁方\u0002あけがた\u0003の眠りを覚す暁の\u0001驟雨\u0002しゅうう\u0003は何だか木の葉を吹き散す嵐の様に思われたりするので、何だか物淋しく、その音に聴き入るのである。", "ほろほろと鳴く野の鳥の啼き声を聞くにつけても今の一声は父の声ではなかったか、それ共母の声ではなかったかと疑って見たりして昔、父母の居ます頃の生活を懐しく思い出して見たりするのである。こんなに山深く住んでいると同じく山深くに住む鹿などが馴れ馴れしく庵の近くまでやって来るのを見ても自分がどれだけ俗世から遠く離れて暮しているかと云う事を示された様に思われて何か知ら淋しい様な感も抱かれたりする事もある。", "六十余りの老境に入って見ると夜の眠れない事が時々にあるのだがそうした時の唯一の楽しみは炭火をかきおこしてこれに暖まるのが何よりである。こうした時には炭火でも大切な友達になってくれるものなのである。別に恐ろしい事のあると云う程に山奥でもないのであるけれども陰気な梟の鳴き声を聞いたりすると何だか心淋しく哀れさをしみじみと感じさせられて感に堪えぬ事もないではない。", "この様に山の中の景物は春夏秋冬それぞれに面白味のあるものを与えてくれて中々に尽きるものではない。まして私達よりも内省の深く、知覚の鋭い人々であったならば私の感じた物以外にもまだまだ面白味のあるものを発見してこれを楽しむ事が出来たであろうけれども私の様なものでは以上の様なものにしか楽しみを見出すことも出来ず何だか身を哀れに思うのである。", "私がこうやって山の中に入って住む様になってから早や五年の月日が立ってしまった。月日の経つにつれて庵も所々が破れ損じているし、軒下には落葉が深く積っているし、そしてその葉は朽ちるにまかせてあるのだ。又苔が床の上に一杯に生える様にさえなった。", "京からの時々の風の便りに貴い身分の人達の多くが亡くなられたと云う事を聞くことがあるのだが、それと同じ様に身分の賤しい人々も沢山に死んでいる事であろうと思われる。", "多くの住家が度々の火災の為に焼け失せたと云う話を聞くのであるが、この賤しい自分の住家だけは火災にも遭わずまことに平和なものである。どの様に狭いものであった所で夜の寝床はあるのだし、昼の書見をしたりする所もちゃんとあるのだから、自分自身が住む上には何等の不便も不足も感じないのである。やどかりが小さい貝の中に住むのもきっと自分の身の程を\u0001弁\u0002わきま\u0003えての事で、やどかりには小さい貝が相応した住家なのである、又みさごが人を恐れるのあまりに浪の荒い海岸にいて人々を近づけないのである。やどかりやみさごの様に自分は自分なりの小さい住家に住み、そうして世の中の果敢なさ、自分の運命の哀れを知って世を離れてこうした山の中に住み、富も求めず、位も求めずに、まして俗世間と交際ある様な事もなく、みさごや、やどかりが自分自身だけの平安を楽しむ様に唯一人で何の不安もなく暮しているのである。", "総て世の中の人々が家を建てる目的はほとんど自分自身の為では決してなく、親の為だとか妻子の為だとか、他の家族の為に建てると云うが普通である。又は他人への見栄の為に建てたり、主君や、師匠の為に建てたりするものなのである。財産や宝物を入れる為に建てたりする事もあって決して自分だけの為に建てると云う事はないものなのである。所が現在の私の建物は純粋に私自身の為に建てたものなのである。人の為に建てると云った所で私には既に両親はないのだし、妻や子供すらも無い事だし、又一緒に住む様な友達もなく、使用人も置いてないのだし、全然今の境遇では家を建ててやる様な人は居ないのであるから結局自分自身の為に建てることになったのである。現在の世の中に於ては人の友達になる為には先ず何よりもお金持でなければならず、そしてその人になれ親しむと云う事でなければならず、必ずしも情に深くて素直であると云う事は必要とされないのであるからこの様な軽薄な友達付き合いをする位ならば、それよりも山の中に居て自然を友とし音楽を友としてその日その日を暮らすのがどれだけに好い事か知れやしないのである。", "又人の使用人になろうとする様な人々は先ず給料の多い事を望み、何でもお金になる所へのみ行きたがっている始末で、可愛がって情けをかけてやって養ってやっていても給料が少かったりすると決してそこには使われている事は承知しない有様なのである。これでは人を使って却って苦しまなくてはならないのである。そこで使用人を使わずに自分自身を使用人にするのが一番に好い事なのである。多少はそうすれば厄介な事もあるけれども人を使って苦しむよりはどれだけ好いかも知らないのである。歩かなければならない事があれば自分の足で歩く事にするのである。そうすれば多少は苦しい事ではあるが、牛車や馬車に乗って気を使うよりはどれだけに楽であるか知れないのである。私の身は二つの使用人を兼ねているのである。一つは手でこれは召使の用をしてくれるのだし、一つは足でこれは乗物の役をしてくれてどちらも私を充分に満足させてくれるのである。こうした為に自分の体が苦しくなって来たら使うのを止めて充分に休ませて、又丈夫になったら使うことにしているから決して無理をすると云う事はないのである。だるくなって歩くのも、仕事をするのも気が向かない時でも何も気に病む事はないのである。まして毎日働いたり、歩いたりすることは\u0001此\u0002こ\u0003の上ない身の養生となる事なのである。だからどうしても何もしないで怠けていると云う訳には行かないのである。", "歩いたり、自分の身の廻りの事を他人の手を借りると云う事は明かに一つの罪悪でなければならないのである。", "衣食の事に就ても同じ事が言い得ると思うのである。藤の衣、麻の夜具と云った様なもので着るものは充分に間に合うのであってそれ以上のものは不用なものなのである。又野辺にあるつばなや、峯にあるいわなしの実などを取って食べていればそれで充分に生きて行けるのであってそれ以上は又不用なものなのである。他の人々とは全然交際しないのであるからどんなに貧しい身なりをしていた所で誰も何とも言うものでもないのだし、又食物の至って乏しい山の中であるのだからどんなにまずいものでもおいしく食べられるのである。こうして今の自分の生活を書いて見るのは何も他の富める人々にこうした暮らしをせよと云って教訓するのではなく、唯自分がまだ俗世を捨てずに俗世に住んでいた時の生活と今の生活とを比較するために書いて見たまでの事なのである。", "この世の中と云うものは心の持ち方一つで苦しい世の中にもなり、楽しい世の中にもなるものである。精神がもし安心立命の境地に立っていなかったならばどれだけお金があり立派な住家に住んでいてもそれは何もならないのであって、やはり苦しい暮しをしなければならないのである。今自分はこうして淋しい山の中へ来て唯\u0001一間\u0002ひとま\u0003しかない所の狭い家に住んでいるけれども精神は真に平安で、毎日毎日を非常に楽しく暮しているのである。", "その上にこの様に粗末な住家だけれど私はこの住家をこの上もなく愛しているのである。", "たまたま都の方に出て托鉢をするのであるが、そんな時には自分がこんな乞食坊主になった事を恥しいとは思う事があるのだけれども、この小さな自分の住家に帰って見ると、俗世の人々が浮世の名利にのみ執着して暮しているのを考えて見るとそれらの人々が哀れにさえなって来るのである。が私がこんな事を言えば人々はお前は夢の様な事を言うと言うかも知れないが、しかし魚や、鳥の生活を深く考えて見ると好いのである。魚は一生を水の中に暮して少しも水にあきる事がない、又鳥はその一生を林の中で送ることを願っているのである。この鳥の気持や、魚の気持は魚自身、鳥自身でなくては知る事が出来ないのである。私もその様に山の中で世を離れて唯一人住んでいるこの心持はほんとにそうした生活をやって見なくては、解るものではないのである。山の中の閑居の楽しさ、淋しさ等には俗世では味う事の出来ない深い味いのあるものであってほんとに実践した人でなくてはこの味は解るものではない。この味は高位高官に登るよりも、お金持になることよりも数等増しで私には好いことであり楽しい事なのである。", "さて私の一生ももう余命幾何もなくして死出の旅路に出なくてはならないのであるが、もう現在では何も今更に嘆くことも、悲しむ事もないのである。仏様の\u0001御教\u0002みおしえ\u0003は何事に対しても執着心を持つなとあるのだが、今こうして心静かに楽しく住み得るこの山の中の草庵を愛することさえ一つの執着心の現れで罪悪なのである。私は仏様の世界から見れば何等価値のない楽しみをごたごたと並べ立てて無駄な時を過したものである。", "物静かな夜明け方にこうした真理を考え続けて行き、自分の心持を深く反省して見ると自分がこうして浮世を脱れて山の中へ入った最初の目的は何だったかと云えばそれは仏様の道に精進しようとしてやった事なのであるが、それにも拘わらず自分の生活というものを考えて見ると外見は聖人の様ではあるがその心持はまだまだ聖人には遠く及びも付かないもので全く俗人の如くに濁ったものなのである。私の住家は昔の\u0001維摩\u0002ゆいま\u0003居士の方丈の庵室を真似て建てたのであるが、自分の行いや信仰の上に於ては一番\u0001魯鈍\u0002ろどん\u0003だったと言われている仏弟子の\u0001周利槃特\u0002しゅりはんどく\u0003のものにすら劣っているではないか。そしてこの原因はあまりにも貧しい苦しみをしたのでその為にあまりに苦しんだから思う様に修業が出来なかったのであろうか、又は煩悩があまりにも強かったが為に心が狂ったのであったか、等と自分がどうして悟入出来得なかったかと自問自答しても何等の答も与えられなかった。それで唯口舌の力を借りて南無阿弥陀仏と二、三度仏の御名を唱えてその加護をお祈りするまでである。", "時に建暦二年三月晦日頃、僧\u0001蓮胤\u0002れんいん\u0003が外山の庵で\u0001之\u0002これ\u0003を書き\u0001誌\u0002しる\u0003したものである。"], "M": {"0": [[0, 4]], "1": [[5, 6]], "2": [[7, 7]], "3": [[8, 8]], "4": [[9, 9]], "5": [[9, 9]], "6": [[10, 10]], "7": [[11, 14]], "8": [[15, 15]], "9": [[16, 17]], "10": [[18, 21]], "11": [[22, 26]], "12": [[27, 29]], "13": [[30, 31]], "14": [[32, 33]], "15": [[34, 37]], "16": [[38, 45]], "17": [[46, 47]], "18": [[48, 53]], "19": [[54, 58]], "20": [[59, 62]], "21": [[63, 64]], "22": [[65, 71]], "23": [[72, 76]], "24": [[77, 79]], "25": [[80, 80]], "26": [[81, 81]], "27": [[82, 82]], "28": [[83, 85]], "29": [[86, 87]], "30": [[88, 93]], "31": [[94, 97]], "32": [[98, 100]], "33": [[101, 102]], "34": [[103, 108]], "35": [[109, 112]], "36": [[113, 115]], "37": [[116, 117]], "38": [[118, 119], [121, 122, 1]], "39": [[120, 120], [123, 128]], "40": [[129, 129]], "41": [[130, 131]], "42": [[136, 137]], "43": [[132, 135], [138, 143]], "44": [[144, 151]], "45": [[152, 154]], "46": [[155, 156]], "47": [[157, 157]], "48": [[158, 161]], "49": [[162, 165]], "50": [[166, 168]], "51": [[169, 178]], "52": [[179, 187]], "53": [[188, 188]], "54": [[189, 189]], "55": [[190, 191]], "56": [[192, 193]], "57": [[194, 196]], "58": [[197, 200]], "59": [[201, 214]], "60": [[215, 215]], "61": [[216, 216]], "62": [[217, 217]], "63": [[218, 219]], "64": [[220, 220]], "65": [[221, 222]], "66": [[223, 224]], "67": [[225, 232]], "68": [[233, 240]], "69": [[241, 253]], "70": [[254, 255]], "71": [[256, 264]], "72": [[265, 266]], "73": [[267, 267]], "74": [[268, 273]], "75": [[274, 278]], "76": [[279, 283]], "77": [[284, 285]]}, "CH": [[0, "序", "ゆく川の流れ"], [8, "一", "安元の大火"], [14, "二", "治承の辻風"], [17, "三", "福原遷都"], [24, "四", "養和の飢饉"], [35, "五", "元暦の大地震"], [41, "六", "世の住みにくさ"], [44, "七", "出家と最初の庵"], [48, "八", "方丈の庵"], [52, "九", "外山の四季"], [59, "十", "山あるき"], [65, "十一", "閑居の気味"], [75, "結", "自問と念仏"]]};
